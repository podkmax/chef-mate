server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/chefmate
spring.datasource.username=chef
spring.datasource.password=chefpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

server.port=8080
spring.application.name=chefmate-backend

# PostgreSQL datasource (docker-compose defaults)
spring.datasource.url=jdbc:postgresql://localhost:5432/chefmate
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=5

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JDBC
spring.sql.init.mode=never


