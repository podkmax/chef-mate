databaseChangeLog:
  - changeSet:
      id: 20250130-01-create-unit-table
      author: codex
      changes:
        - createTable:
            tableName: unit
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: short_name
                  type: varchar(16)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: unit
            columnNames: short_name
            constraintName: uq_unit_short_name

