            constraintName: ck_client_stock_unit

  - changeSet:
      id: 20250130-04-update-dish-ingredient-unit
      author: codex
      changes:
        - dropUniqueConstraint:
            tableName: dish_ingredient
            constraintName: ux_dishingr_dishid_name_unit
        - addColumn:
            tableName: dish_ingredient
            columns:
              - column:
                  name: unit_id
                  type: UUID
        - sql:
            sql: |
              WITH normalized AS (
                  SELECT
                      di.id,
                      CASE
                          WHEN di.unit IS NULL OR trim(di.unit) = '' THEN 'г'
                          WHEN lower(trim(di.unit)) IN ('g','gr','gram','grams','гр','г') THEN 'г'
                          WHEN lower(trim(di.unit)) IN ('kg','кг','килограмм','килограммы') THEN 'кг'
                          WHEN lower(trim(di.unit)) IN ('ml','мл','миллилитр','миллилитры') THEN 'мл'
                          WHEN lower(trim(di.unit)) IN ('l','литр','литры','л') THEN 'л'
                          WHEN lower(trim(di.unit)) IN ('pcs','piece','pieces','шт','шт.') THEN 'шт'
                          WHEN lower(trim(di.unit)) IN ('уп','уп.','упаковка','упаковки') THEN 'уп'
                          WHEN lower(trim(di.unit)) IN ('зуб','зубчик','зубчики','зубчиков') THEN 'зуб'
                          WHEN lower(trim(di.unit)) IN ('гол','головка','головки') THEN 'гол'
                          ELSE lower(trim(di.unit))
                      END AS target_short
                  FROM dish_ingredient di
              )
              UPDATE dish_ingredient di
              SET unit_id = u.id
              FROM normalized n
              JOIN unit u ON lower(u.short_name) = lower(n.target_short)
              WHERE di.id = n.id;
        - sql:
            sql: |
              UPDATE dish_ingredient di
              SET unit_id = (SELECT id FROM unit WHERE short_name = 'г')
              WHERE unit_id IS NULL;
        - addNotNullConstraint:
            tableName: dish_ingredient
            columnName: unit_id
            constraintName: nn_dish_ingredient_unit
        - addForeignKeyConstraint:
            baseTableName: dish_ingredient
            baseColumnNames: unit_id
            referencedTableName: unit
            referencedColumnNames: id
            constraintName: fk_dish_ingredient_unit
            onDelete: restrict
        - dropColumn:
            tableName: dish_ingredient
            columnName: unit
        - addUniqueConstraint:
            tableName: dish_ingredient
            columnNames: dish_id,name,unit_id
            constraintName: ux_dishingr_dishid_name_unitid

