version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chefmate-postgres
    environment:
      POSTGRES_DB: chefmate
      POSTGRES_USER: chef
      POSTGRES_PASSWORD: chefpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chef -d chefmate"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: chefmate-postgres
    environment:
      POSTGRES_DB: chefmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:


